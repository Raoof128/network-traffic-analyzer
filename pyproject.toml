[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-analyzer"
version = "1.1.0"
description = "ML-powered network traffic analysis and anomaly detection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Network Traffic Analyzer Contributors"}
]
maintainers = [
    {name = "Network Traffic Analyzer Team"}
]
keywords = [
    "network",
    "traffic",
    "analysis",
    "anomaly-detection",
    "machine-learning",
    "security",
    "monitoring",
    "packet-capture",
    "pcap",
    "scapy",
    "intrusion-detection",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "scapy>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0.0",
    "mypy>=1.7.0",
    "flake8>=7.0.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.1.0",
    "py-spy>=0.3.14",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]
api = [
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
]
all = [
    "network-traffic-analyzer[dev,api,ml,viz]",
]

[project.urls]
Homepage = "https://github.com/Raoof128/network-traffic-analyzer"
Documentation = "https://github.com/Raoof128/network-traffic-analyzer#readme"
Repository = "https://github.com/Raoof128/network-traffic-analyzer"
"Bug Tracker" = "https://github.com/Raoof128/network-traffic-analyzer/issues"
Changelog = "https://github.com/Raoof128/network-traffic-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
network-traffic-analyzer = "analyzer:main"
nta = "analyzer:main"
nta-train = "train_model:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "examples", "examples.*", "docs", "docs.*"]

[tool.setuptools.package-data]
"*" = ["config/*.yaml", "detection/rules/*.yaml", "features/*.yaml"]

# Black configuration
[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["capture", "features", "models", "detection", "visualization", "api", "config", "utils"]

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
    "*/examples/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
show_error_codes = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "scapy.*",
    "plotly.*",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# Bandit configuration
[tool.bandit]
targets = ["."]
exclude_dirs = [
    "/tests",
    "/venv",
    "/env",
    "/.venv",
    "/build",
    "/dist",
]
skips = ["B101", "B601"]

# Pylint configuration (minimal - detailed config in .pylintrc)
[tool.pylint.master]
max-line-length = 120
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
]
