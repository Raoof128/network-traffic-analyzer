[pytest]
# Pytest configuration for Network Traffic Analyzer
# https://docs.pytest.org/en/stable/reference/customize.html

# Test discovery paths
testpaths = tests

# Test file patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Command line options
addopts =
    # Verbosity
    -v
    --tb=short
    --strict-markers
    --strict-config

    # Coverage
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --cov-fail-under=70

    # Output
    --color=yes
    --code-highlight=yes

    # Performance
    --durations=10
    --durations-min=1.0

    # Warnings
    -W error
    -W ignore::UserWarning
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests (quick sanity checks)
    regression: marks tests as regression tests
    security: marks tests as security tests
    performance: marks tests as performance tests
    network: marks tests that require network access
    requires_root: marks tests that require root/admin privileges
    requires_interface: marks tests that require network interface access
    gpu: marks tests that require GPU

# Minimum Python version
minversion = 7.0

# Test output
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Ignore paths
norecursedirs =
    .git
    .github
    .tox
    .eggs
    *.egg
    *.egg-info
    dist
    build
    docs
    .venv
    venv
    env
    __pycache__
    .mypy_cache
    .pytest_cache
    .hypothesis
    node_modules
    data
    models/trained_models

# Timeout for tests (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Coverage source
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    setup.py
    */examples/*
    */docs/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover

    # Don't complain about missing debug-only code
    def __repr__
    def __str__

    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError

    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:

    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod

    # Don't complain about overload definitions
    @overload

    # Don't complain about protocol definitions
    \.\.\.

    # Don't complain about pass statements
    pass

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
